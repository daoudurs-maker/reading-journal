<body>
<div id="rj-root"></div>
<style>
  #rj-root {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    max-width: 480px;
    margin: 0 auto;
    color: #2A2A26;
  }
  .rj-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .rj-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid #D9D2BC;
    background: #F7F3EA;
  }
  .rj-title {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.2px;
    margin: 0 0 4px;
    color: #1F2E23;
  }
  .rj-sub {
    font-size: 13px;
    color: #5C6E5A;
    margin: 0;
  }
  .rj-body { background: #F7F3EA; padding: 16px 20px 40px; min-height: 200px; }
  .rj-addbar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .rj-addbtn {
    font-family: inherit;
    background: #1F2E23;
    color: #F7F3EA;
    border: none;
    border-radius: 3px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  .rj-addbtn:active { transform: scale(0.98); }
  .rj-count {
    font-size: 12px;
    color: #5C6E5A;
    margin-bottom: 14px;
  }
  .rj-shelf { display: flex; flex-direction: column; gap: 10px; }
  .rj-card {
    display: flex;
    gap: 12px;
    background: #E8DFC8;
    border-radius: 4px;
    padding: 12px;
    border-left: 3px solid #B8843C;
    position: relative;
  }
  .rj-cover {
    width: 52px;
    height: 76px;
    flex-shrink: 0;
    background: #C9BE9E;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7A7156;
    font-size: 10px;
    text-align: center;
  }
  .rj-cover img { width: 100%; height: 100%; object-fit: cover; }
  .rj-info { flex: 1; min-width: 0; }
  .rj-book-title {
    font-size: 16px;
    margin: 0 0 2px;
    color: #1F2E23;
    line-height: 1.3;
  }
  .rj-author {
    font-size: 13px;
    color: #5C6E5A;
    margin: 0 0 6px;
    font-style: italic;
  }
  .rj-meta { font-size: 11px; color: #7A7156; margin: 0 0 4px; }
  .rj-notes { font-size: 12px; color: #3D3D38; margin: 4px 0 0; line-height: 1.4; }
  .rj-rating { color: #B8843C; font-size: 12px; letter-spacing: 1px; }
  .rj-del {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: #7A7156;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .rj-empty {
    text-align: center;
    padding: 40px 20px;
    color: #7A7156;
    font-size: 14px;
  }
  .rj-modal-backdrop {
    position: static;
    background: #E8DFC8;
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .rj-field { margin-bottom: 10px; }
  .rj-field label {
    display: block;
    font-size: 11px;
    color: #5C6E5A;
    margin-bottom: 3px;
  }
  .rj-field input[type=text], .rj-field textarea, .rj-field input[type=date] {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
    padding: 8px;
    border: 1px solid #C9BE9E;
    border-radius: 3px;
    background: #FBF9F2;
    color: #2A2A26;
  }
  .rj-field textarea { resize: vertical; min-height: 50px; }
  .rj-star-row { display: flex; gap: 4px; }
  .rj-star-btn {
    background: none; border: none; font-size: 22px; cursor: pointer;
    color: #C9BE9E; padding: 0;
  }
  .rj-star-btn.active { color: #B8843C; }
  .rj-form-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rj-cancel-btn {
    font-family: inherit; background: none; border: 1px solid #C9BE9E;
    color: #5C6E5A; border-radius: 3px; padding: 9px 14px; font-size: 13px; cursor: pointer; flex: 1;
  }
  .rj-save-btn {
    font-family: inherit; background: #B8843C; color: #FBF9F2; border: none;
    border-radius: 3px; padding: 9px 14px; font-size: 13px; cursor: pointer; flex: 2;
  }
  .rj-imgbtn {
    font-family: inherit; font-size: 12px; background: #FBF9F2; border: 1px solid #C9BE9E;
    border-radius: 3px; padding: 6px 10px; cursor: pointer; color: #5C6E5A;
  }
  .rj-note {
    font-size: 11px; color: #7A7156; margin-top: 14px; padding-top: 10px;
    border-top: 1px solid #D9D2BC; line-height: 1.5;
  }
  .rj-error { color: #A34A2E; font-size: 12px; margin-top: 4px; }
  .rj-backup-row { display: flex; gap: 8px; margin-top: 12px; }
  .rj-backup-btn {
    font-family: inherit; font-size: 12px; background: none; border: 1px solid #C9BE9E;
    color: #5C6E5A; border-radius: 3px; padding: 7px 10px; cursor: pointer; flex: 1;
  }
  .rj-backup-status { font-size: 11px; color: #5C6E5A; margin-top: 6px; }
  .rj-row2 { display: flex; gap: 8px; }
  .rj-row2 > div { flex: 1; }
  .rj-row2 > div.rj-numcol { flex: 0 0 72px; }
  .rj-field input[type=number] {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
    padding: 8px;
    border: 1px solid #C9BE9E;
    border-radius: 3px;
    background: #FBF9F2;
    color: #2A2A26;
  }
  .rj-chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .rj-chip {
    font-family: inherit; font-size: 11px; background: #FBF9F2; border: 1px solid #C9BE9E;
    border-radius: 12px; padding: 4px 10px; cursor: pointer; color: #5C6E5A;
  }
  .rj-hint { font-size: 10px; color: #7A7156; margin-top: 4px; }
  .rj-tagpill {
    display: inline-block; font-size: 10px; background: #D9D2BC; color: #4A4636;
    border-radius: 10px; padding: 2px 8px; margin: 2px 4px 0 0;
  }
  .rj-series-line { font-size: 11px; color: #7A7156; margin: 0 0 2px; font-style: italic; }
  .rj-tabs {
    display: flex; gap: 4px; margin-top: 14px; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .rj-tab {
    font-family: inherit; font-size: 12px; background: none; border: 1px solid #C9BE9E;
    color: #5C6E5A; border-radius: 14px; padding: 7px 12px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .rj-tab.active { background: #1F2E23; color: #F7F3EA; border-color: #1F2E23; }
  .rj-banner {
    background: #EFE4C4; border-left: 3px solid #B8843C; border-radius: 4px;
    padding: 10px 12px; margin-bottom: 14px; font-size: 12px; color: #4A4636; line-height: 1.5;
  }
  .rj-status-line { font-size: 11px; color: #7A7156; margin: 0 0 4px; }
  .rj-reason { font-size: 12px; color: #3D3D38; margin: 4px 0 0; line-height: 1.4; }
  .rj-actions-row { display: flex; gap: 6px; margin-top: 8px; }
  .rj-action-btn {
    font-family: inherit; font-size: 11px; background: #FBF9F2; border: 1px solid #C9BE9E;
    color: #4A4636; border-radius: 3px; padding: 5px 9px; cursor: pointer;
  }
  .rj-pager { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 16px; flex-wrap: wrap; }
  .rj-page-btn {
    font-family: inherit; font-size: 12px; background: none; border: 1px solid #C9BE9E;
    color: #5C6E5A; border-radius: 3px; width: 28px; height: 28px; cursor: pointer;
  }
  .rj-page-btn.active { background: #1F2E23; color: #F7F3EA; border-color: #1F2E23; }
  .rj-page-btn:disabled { opacity: 0.35; cursor: default; }
  .rj-page-dots { font-size: 12px; color: #7A7156; padding: 0 2px; }
  .rj-year-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
  .rj-year-arrow {
    font-family: inherit; font-size: 16px; background: none; border: 1px solid #C9BE9E;
    color: #4A4636; border-radius: 3px; width: 30px; height: 30px; cursor: pointer;
  }
  .rj-year-label { font-size: 16px; color: #1F2E23; min-width: 56px; text-align: center; }
  .rj-stat-title { font-size: 13px; color: #4A4636; margin: 0 0 10px; }
  .rj-bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; margin-bottom: 6px; }
  .rj-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .rj-bar { width: 100%; background: #B8843C; border-radius: 2px 2px 0 0; min-height: 2px; }
  .rj-bar-count { font-size: 9px; color: #7A7156; margin-bottom: 2px; }
  .rj-bar-labels { display: flex; gap: 5px; margin-bottom: 22px; }
  .rj-bar-labels span { flex: 1; text-align: center; font-size: 9px; color: #7A7156; }
  .rj-stat-total { font-size: 12px; color: #5C6E5A; text-align: center; margin: -8px 0 20px; }
  .rj-pie-wrap { display: flex; align-items: center; gap: 18px; }
  .rj-pie { width: 120px; height: 120px; border-radius: 50%; flex-shrink: 0; }
  .rj-legend { flex: 1; font-size: 12px; }
  .rj-legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .rj-legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .rj-legend-label { color: #4A4636; flex: 1; }
  .rj-legend-pct { color: #7A7156; }
</style>
<script>
(function() {
  const root = document.getElementById('rj-root');
  const TABS = [
    { key: 'reading', label: 'Reading now' },
    { key: 'finished', label: 'Finished' },
    { key: 'dnf', label: "Didn't finish" },
    { key: 'tbr', label: 'TBR' },
    { key: 'stats', label: 'Stats' }
  ];
  const TBR_STALE_DAYS = 30;
  const DNF_REVISIT_DAYS = 45;
  const PAGE_SIZE = 6;
  const MONTH_LABELS = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  const RATING_COLORS = ['#E8DFC8', '#D9C79E', '#C9A968', '#B8843C', '#8F6529', '#6B4B1E'];

  let books = [];
  let currentTab = 'reading';
  let showForm = false;
  let editingId = null;
  let formStatus = 'reading';
  let coverData = null;
  let loaded = false;
  let saveError = false;
  let backupStatus = '';
  let pageByTab = { reading: 1, finished: 1, dnf: 1, tbr: 1 };
  let statsYear = new Date().getFullYear();

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function daysSince(dateStr) {
    if (!dateStr) return null;
    const then = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.floor((now - then) / 86400000);
  }

  function fmtDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  async function loadBooks() {
    try {
      const raw = localStorage.getItem('rj-books');
      books = raw ? JSON.parse(raw) : [];
      let migrated = false;
      books.forEach(b => {
        if (!b.status) {
          b.status = 'finished';
          migrated = true;
        }
      });
      if (migrated) localStorage.setItem('rj-books', JSON.stringify(books));
    } catch (e) {
      books = [];
    }
    loaded = true;
    render();
  }

  async function persist() {
    try {
      localStorage.setItem('rj-books', JSON.stringify(books));
      saveError = false;
    } catch (e) {
      saveError = true;
    }
    render();
  }

  function openAddForm() {
    editingId = null;
    formStatus = currentTab;
    coverData = null;
    showForm = true;
    render();
  }

  function openEditForm(id) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    formStatus = b.status;
    coverData = b.cover || null;
    showForm = true;
    render();
  }

  function openMoveForm(id, newStatus) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    formStatus = newStatus;
    coverData = b.cover || null;
    showForm = true;
    render();
  }

  function closeForm() {
    showForm = false;
    editingId = null;
    coverData = null;
    render();
  }

  function stars(n) {
    let s = '';
    for (let i = 1; i <= 5; i++) s += (i <= n ? '\u2605' : '\u2606');
    return s;
  }

  function knownSeries() {
    const names = new Set();
    books.forEach(b => { if (b.series) names.add(b.series); });
    return Array.from(names).sort((a, b) => a.localeCompare(b));
  }

  function knownTags() {
    const tags = new Set();
    books.forEach(b => (b.tags || []).forEach(t => tags.add(t)));
    return Array.from(tags).sort((a, b) => a.localeCompare(b));
  }

  function nextSeriesNumber(seriesName, excludeId) {
    if (!seriesName) return '';
    const match = seriesName.trim().toLowerCase();
    let max = 0;
    books.forEach(b => {
      if (b.id === excludeId) return;
      if ((b.series || '').trim().toLowerCase() === match) {
        const n = parseFloat(b.seriesNumber);
        if (!isNaN(n) && n > max) max = n;
      }
    });
    return max > 0 ? max + 1 : 1;
  }

  function statusFieldsHtml(status, editing) {
    if (status === 'tbr') {
      return `
        <div class="rj-field">
          <label>Notes (optional)</label>
          <textarea id="rj-f-notes" placeholder="Why this one, who recommended it, anything">${esc(editing ? editing.notes || '' : '')}</textarea>
        </div>`;
    }
    if (status === 'reading') {
      return `
        <div class="rj-field">
          <label>Started</label>
          <input type="date" id="rj-f-startdate" value="${editing && editing.startDate ? editing.startDate : todayStr()}" />
        </div>
        <div class="rj-field">
          <label>Notes (optional)</label>
          <textarea id="rj-f-notes" placeholder="First impressions, anything">${esc(editing ? editing.notes || '' : '')}</textarea>
        </div>`;
    }
    if (status === 'dnf') {
      return `
        <div class="rj-field">
          <label>Set aside on</label>
          <input type="date" id="rj-f-dnfdate" value="${editing && editing.dnfDate ? editing.dnfDate : todayStr()}" />
        </div>
        <div class="rj-field">
          <label>Why did you stop?</label>
          <textarea id="rj-f-reason" placeholder="Lost interest, wrong mood for it, too slow...">${esc(editing ? editing.reason || '' : '')}</textarea>
        </div>
        <div class="rj-field">
          <label>Notes (optional)</label>
          <textarea id="rj-f-notes" placeholder="Anything else">${esc(editing ? editing.notes || '' : '')}</textarea>
        </div>`;
    }
    // finished
    return `
      <div class="rj-field">
        <label>Date finished</label>
        <input type="date" id="rj-f-date" value="${editing && editing.date ? editing.date : todayStr()}" />
      </div>
      <div class="rj-field">
        <label>Rating</label>
        <div class="rj-star-row" id="rj-star-row">
          ${[1,2,3,4,5].map(i => `<button type="button" class="rj-star-btn${(editing && editing.rating >= i) ? ' active' : ''}" data-star="${i}">\u2605</button>`).join('')}
        </div>
      </div>
      <div class="rj-field">
        <label>Notes (optional)</label>
        <textarea id="rj-f-notes" placeholder="What you thought, favorite quote, anything">${esc(editing ? editing.notes || '' : '')}</textarea>
      </div>`;
  }

  function cardExtrasHtml(b) {
    if (b.status === 'tbr') {
      const d = daysSince(b.addedDate);
      return `<p class="rj-status-line">${b.addedDate ? 'Added ' + fmtDate(b.addedDate) + (d !== null ? ' · ' + d + ' day' + (d === 1 ? '' : 's') + ' ago' : '') : 'On your TBR'}</p>`;
    }
    if (b.status === 'reading') {
      const d = daysSince(b.startDate);
      return `<p class="rj-status-line">${b.startDate ? 'Started ' + fmtDate(b.startDate) + (d !== null ? ' · ' + d + ' day' + (d === 1 ? '' : 's') + ' in' : '') : 'In progress'}</p>`;
    }
    if (b.status === 'dnf') {
      const d = daysSince(b.dnfDate);
      return `<p class="rj-status-line">${b.dnfDate ? 'Set aside ' + fmtDate(b.dnfDate) + (d !== null ? ' · ' + d + ' days ago' : '') : 'Set aside'}</p>${b.reason ? `<p class="rj-reason">${esc(b.reason)}</p>` : ''}`;
    }
    return `<p class="rj-meta rj-sans">${b.date ? fmtDate(b.date) : ''}</p>${b.rating ? `<p class="rj-rating">${stars(b.rating)}</p>` : ''}`;
  }

  function cardActionsHtml(b) {
    if (b.status === 'tbr') {
      return `<div class="rj-actions-row"><button class="rj-action-btn" data-start="${b.id}">Start reading</button></div>`;
    }
    if (b.status === 'reading') {
      return `<div class="rj-actions-row"><button class="rj-action-btn" data-finish="${b.id}">Mark finished</button><button class="rj-action-btn" data-dnf="${b.id}">Didn't finish</button></div>`;
    }
    if (b.status === 'dnf') {
      return `<div class="rj-actions-row"><button class="rj-action-btn" data-retry="${b.id}">Try again</button></div>`;
    }
    return '';
  }

  function reminderBannerHtml() {
    if (currentTab === 'tbr') {
      const stale = books.filter(b => b.status === 'tbr' && b.addedDate && daysSince(b.addedDate) >= TBR_STALE_DAYS);
      if (stale.length === 0) return '';
      const names = stale.slice(0, 2).map(b => esc(b.title)).join(', ');
      const extra = stale.length > 2 ? ' and ' + (stale.length - 2) + ' more' : '';
      return `<div class="rj-banner rj-sans">${stale.length} book${stale.length === 1 ? ' has' : 's have'} sat on your TBR for over a month${names ? ' — ' + names + extra : ''}. Still want to read them, or are you just adding more than you'll get to?</div>`;
    }
    if (currentTab === 'dnf') {
      const stale = books.filter(b => b.status === 'dnf' && b.dnfDate && daysSince(b.dnfDate) >= DNF_REVISIT_DAYS);
      if (stale.length === 0) return '';
      const names = stale.slice(0, 2).map(b => esc(b.title)).join(', ');
      const extra = stale.length > 2 ? ' and ' + (stale.length - 2) + ' more' : '';
      return `<div class="rj-banner rj-sans">It's been a while since you set aside ${names}${extra}. Worth revisiting, or is it time to let ${stale.length === 1 ? 'it' : 'them'} go for good?</div>`;
    }
    return '';
  }

  function yearsWithFinished() {
    const years = new Set();
    books.forEach(b => { if (b.status === 'finished' && b.date) years.add(parseInt(b.date.slice(0, 4), 10)); });
    years.add(new Date().getFullYear());
    return Array.from(years).sort((a, b) => a - b);
  }

  function monthlyCounts(year) {
    const counts = new Array(12).fill(0);
    books.forEach(b => {
      if (b.status === 'finished' && b.date && parseInt(b.date.slice(0, 4), 10) === year) {
        counts[parseInt(b.date.slice(5, 7), 10) - 1]++;
      }
    });
    return counts;
  }

  function ratingDistribution() {
    const counts = [0, 0, 0, 0, 0, 0]; // index 0 = unrated
    books.forEach(b => {
      if (b.status !== 'finished') return;
      const r = b.rating && b.rating >= 1 && b.rating <= 5 ? b.rating : 0;
      counts[r]++;
    });
    return counts;
  }

  function statsHtml() {
    const years = yearsWithFinished();
    if (!years.includes(statsYear)) statsYear = years[years.length - 1];
    const counts = monthlyCounts(statsYear);
    const maxCount = Math.max(1, ...counts);
    const yearTotal = counts.reduce((a, b) => a + b, 0);
    const yearIdx = years.indexOf(statsYear);

    const dist = ratingDistribution();
    const finishedTotal = dist.reduce((a, b) => a + b, 0);
    let pieHtml, legendHtml;
    if (finishedTotal === 0) {
      pieHtml = `<div class="rj-pie" style="background:#E8DFC8;"></div>`;
      legendHtml = `<p class="rj-sans" style="color:#7A7156; font-size:12px;">No finished books rated yet.</p>`;
    } else {
      let cursor = 0;
      const segments = [];
      for (let r = 5; r >= 0; r--) {
        if (dist[r] === 0) continue;
        const pct = (dist[r] / finishedTotal) * 100;
        segments.push(`${RATING_COLORS[r]} ${cursor}% ${cursor + pct}%`);
        cursor += pct;
      }
      pieHtml = `<div class="rj-pie" style="background: conic-gradient(${segments.join(', ')});"></div>`;
      legendHtml = [5, 4, 3, 2, 1, 0].filter(r => dist[r] > 0).map(r => {
        const pct = Math.round((dist[r] / finishedTotal) * 100);
        const label = r === 0 ? 'Unrated' : r + ' star' + (r === 1 ? '' : 's');
        return `<div class="rj-legend-row"><span class="rj-legend-swatch" style="background:${RATING_COLORS[r]};"></span><span class="rj-legend-label">${label}</span><span class="rj-legend-pct">${pct}% (${dist[r]})</span></div>`;
      }).join('');
    }

    return `
      <div class="rj-year-row rj-sans">
        <button class="rj-year-arrow" id="rj-year-prev" ${yearIdx <= 0 ? 'disabled' : ''} aria-label="Previous year">\u2039</button>
        <span class="rj-year-label">${statsYear}</span>
        <button class="rj-year-arrow" id="rj-year-next" ${yearIdx >= years.length - 1 ? 'disabled' : ''} aria-label="Next year">\u203a</button>
      </div>
      <p class="rj-stat-title rj-sans">Books finished per month</p>
      <div class="rj-bars">
        ${counts.map(c => `<div class="rj-bar-col"><span class="rj-bar-count rj-sans">${c || ''}</span><div class="rj-bar" style="height:${Math.round((c / maxCount) * 100)}%;"></div></div>`).join('')}
      </div>
      <div class="rj-bar-labels rj-sans">${MONTH_LABELS.map(m => `<span>${m}</span>`).join('')}</div>
      <p class="rj-stat-total rj-sans">${yearTotal} finished in ${statsYear}</p>
      <p class="rj-stat-title rj-sans">Rating breakdown, all time</p>
      <div class="rj-pie-wrap">
        ${pieHtml}
        <div class="rj-legend rj-sans">${legendHtml}</div>
      </div>
    `;
  }

  function paginate(list, tab) {
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (!pageByTab[tab] || pageByTab[tab] > totalPages) pageByTab[tab] = totalPages;
    if (pageByTab[tab] < 1) pageByTab[tab] = 1;
    const page = pageByTab[tab];
    const start = (page - 1) * PAGE_SIZE;
    return { pageItems: list.slice(start, start + PAGE_SIZE), page, totalPages };
  }

  function pagerHtml(page, totalPages, tab) {
    if (totalPages <= 1) return '';
    let numbers = [];
    if (totalPages <= 7) {
      numbers = Array.from({ length: totalPages }, (_, i) => i + 1);
    } else {
      const set = new Set([1, totalPages, page, page - 1, page + 1]);
      numbers = Array.from(set).filter(n => n >= 1 && n <= totalPages).sort((a, b) => a - b);
    }
    let html = `<div class="rj-pager rj-sans" data-pager-tab="${tab}">`;
    html += `<button class="rj-page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">\u2039</button>`;
    let prev = 0;
    numbers.forEach(n => {
      if (prev && n - prev > 1) html += `<span class="rj-page-dots">…</span>`;
      html += `<button class="rj-page-btn${n === page ? ' active' : ''}" data-page="${n}">${n}</button>`;
      prev = n;
    });
    html += `<button class="rj-page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} aria-label="Next page">\u203a</button>`;
    html += `</div>`;
    return html;
  }

  function render() {
    if (!loaded) {
      root.innerHTML = '<div class="rj-header"><p class="rj-title">Reading journal</p></div><div class="rj-body"><p class="rj-empty rj-sans">Loading your shelf…</p></div>';
      return;
    }

    const editing = editingId ? books.find(b => b.id === editingId) : null;

    let formHtml = '';
    if (showForm) {
      const saveLabel = editing
        ? (editing.status !== formStatus
            ? (formStatus === 'finished' ? 'Mark as finished' : formStatus === 'dnf' ? 'Save and set aside' : formStatus === 'reading' ? 'Start reading' : 'Save changes')
            : 'Save changes')
        : 'Add book';
      formHtml = `
        <div class="rj-modal-backdrop rj-sans">
          <div class="rj-field">
            <label>Title</label>
            <input type="text" id="rj-f-title" value="${esc(editing ? editing.title : '')}" placeholder="Book title" />
          </div>
          <div class="rj-field">
            <label>Author</label>
            <input type="text" id="rj-f-author" value="${esc(editing ? editing.author : '')}" placeholder="Author name" />
          </div>
          <div class="rj-row2">
            <div class="rj-field">
              <label>Series (optional)</label>
              <input type="text" id="rj-f-series" list="rj-series-list" value="${esc(editing ? editing.series || '' : '')}" placeholder="e.g. Dune" />
              <datalist id="rj-series-list">
                ${knownSeries().map(s => `<option value="${esc(s)}"></option>`).join('')}
              </datalist>
            </div>
            <div class="rj-field rj-numcol">
              <label>Number</label>
              <input type="number" id="rj-f-seriesnum" min="0" step="1" value="${editing && editing.seriesNumber ? editing.seriesNumber : ''}" placeholder="1" />
            </div>
          </div>
          <p class="rj-hint" id="rj-series-hint"></p>
          ${statusFieldsHtml(formStatus, editing)}
          <div class="rj-field">
            <label>Tags (optional, comma separated)</label>
            <input type="text" id="rj-f-tags" value="${esc(editing ? (editing.tags || []).join(', ') : '')}" placeholder="e.g. fantasy, favorite, borrowed" />
            ${knownTags().length ? `<div class="rj-chiprow" id="rj-tag-chips">${knownTags().map(t => `<button type="button" class="rj-chip" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
          </div>
          <div class="rj-field">
            <label>Cover image (optional)</label>
            <input type="file" id="rj-f-img" accept="image/*" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;" />
            <label for="rj-f-img" class="rj-imgbtn" id="rj-img-pick" style="display:inline-block;">${coverData ? 'Change image' : 'Add image'}</label>
            <span id="rj-img-status" style="font-size:11px;color:#5C6E5A;margin-left:8px;">${coverData ? 'Image attached' : ''}</span>
          </div>
          <div id="rj-form-error" class="rj-error"></div>
          <div class="rj-form-actions">
            <button class="rj-cancel-btn" id="rj-cancel">Cancel</button>
            <button class="rj-save-btn" id="rj-save">${saveLabel}</button>
          </div>
        </div>`;
    }

    const inTab = books.filter(b => b.status === currentTab);
    const sortKey = currentTab === 'tbr' ? 'addedDate' : currentTab === 'reading' ? 'startDate' : currentTab === 'dnf' ? 'dnfDate' : 'date';
    const sorted = [...inTab].sort((a, b) => (b[sortKey] || '').localeCompare(a[sortKey] || ''));
    const isStats = currentTab === 'stats';
    let pageInfo = { pageItems: [], page: 1, totalPages: 1 };
    if (!isStats) pageInfo = paginate(sorted, currentTab);

    let shelfHtml = '';
    if (isStats) {
      shelfHtml = '';
    } else if (sorted.length === 0 && !showForm) {
      const emptyMsg = {
        reading: 'Nothing in progress. Start something from your TBR, or add a book you are reading now.',
        finished: 'No finished books yet.',
        dnf: 'Nothing set aside. That is a good thing.',
        tbr: 'Your TBR is empty. Add a book you want to read.'
      }[currentTab];
      shelfHtml = `<p class="rj-empty rj-sans">${emptyMsg}</p>`;
    } else {
      shelfHtml = '<div class="rj-shelf">' + pageInfo.pageItems.map(b => `
        <div class="rj-card">
          <button class="rj-del rj-sans" data-del="${b.id}" aria-label="Delete">\u00d7</button>
          <div class="rj-cover">${b.cover ? `<img src="${b.cover}" alt="" />` : 'no cover'}</div>
          <div class="rj-info" style="min-width:0;">
            <div data-edit="${b.id}" style="cursor:pointer;">
              ${b.series ? `<p class="rj-series-line">${esc(b.series)}${b.seriesNumber ? ' #' + esc(String(b.seriesNumber)) : ''}</p>` : ''}
              <p class="rj-book-title">${esc(b.title) || 'Untitled'}</p>
              <p class="rj-author">${esc(b.author) || 'Unknown author'}</p>
              ${cardExtrasHtml(b)}
              ${b.notes ? `<p class="rj-notes">${esc(b.notes)}</p>` : ''}
              ${(b.tags && b.tags.length) ? `<div class="rj-sans">${b.tags.map(t => `<span class="rj-tagpill">${esc(t)}</span>`).join('')}</div>` : ''}
            </div>
            ${cardActionsHtml(b)}
          </div>
        </div>
      `).join('') + '</div>' + pagerHtml(pageInfo.page, pageInfo.totalPages, currentTab);
    }

    root.innerHTML = `
      <div class="rj-header">
        <p class="rj-title">Reading journal</p>
        <p class="rj-sub rj-sans">A private, personal record of what you read.</p>
        <div class="rj-tabs rj-sans">
          ${TABS.map(t => {
            const count = books.filter(b => b.status === t.key).length;
            return `<button class="rj-tab${currentTab === t.key ? ' active' : ''}" data-tab="${t.key}">${t.label}${count ? ' (' + count + ')' : ''}</button>`;
          }).join('')}
        </div>
        <div class="rj-backup-row rj-sans">
          <button class="rj-backup-btn" id="rj-export">Export backup</button>
          <button class="rj-backup-btn" id="rj-import-btn">Import backup</button>
          <input type="file" id="rj-import-file" accept="application/json" style="display:none" />
        </div>
        <p class="rj-backup-status rj-sans" id="rj-backup-status">${esc(backupStatus)}</p>
      </div>
      <div class="rj-body">
        ${isStats ? '' : `
        <div class="rj-addbar">
          <button class="rj-addbtn rj-sans" id="rj-open-add">${showForm && !editing ? 'Adding a book…' : '+ Add to ' + (TABS.find(t => t.key === currentTab) || {}).label}</button>
        </div>
        ${formHtml}
        ${reminderBannerHtml()}
        <p class="rj-count rj-sans">${sorted.length} book${sorted.length === 1 ? '' : 's'}${saveError ? ' · save failed, try again' : ''}</p>
        `}
        ${isStats ? statsHtml() : shelfHtml}
        <p class="rj-note">Stored privately for you in this app. Nothing here is shared, synced to other services, or used anywhere else.</p>
      </div>
    `;

    document.querySelectorAll('[data-tab]').forEach(el => {
      el.onclick = () => {
        currentTab = el.getAttribute('data-tab');
        showForm = false;
        editingId = null;
        render();
      };
    });

    if (!isStats) {
      if (!showForm) {
        document.getElementById('rj-open-add').onclick = openAddForm;
      } else {
        document.getElementById('rj-open-add').onclick = () => {};
      }
    }

    document.querySelectorAll('[data-page]').forEach(el => {
      el.onclick = () => {
        const n = parseInt(el.getAttribute('data-page'), 10);
        pageByTab[currentTab] = n;
        render();
      };
    });

    const yearPrev = document.getElementById('rj-year-prev');
    const yearNext = document.getElementById('rj-year-next');
    if (yearPrev) yearPrev.onclick = () => {
      const years = yearsWithFinished();
      const idx = years.indexOf(statsYear);
      if (idx > 0) { statsYear = years[idx - 1]; render(); }
    };
    if (yearNext) yearNext.onclick = () => {
      const years = yearsWithFinished();
      const idx = years.indexOf(statsYear);
      if (idx < years.length - 1) { statsYear = years[idx + 1]; render(); }
    };

    document.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        const id = el.getAttribute('data-del');
        books = books.filter(b => b.id !== id);
        persist();
      };
    });
    document.querySelectorAll('[data-edit]').forEach(el => {
      el.onclick = () => openEditForm(el.getAttribute('data-edit'));
    });
    document.querySelectorAll('[data-start]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openMoveForm(el.getAttribute('data-start'), 'reading'); };
    });
    document.querySelectorAll('[data-finish]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openMoveForm(el.getAttribute('data-finish'), 'finished'); };
    });
    document.querySelectorAll('[data-dnf]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openMoveForm(el.getAttribute('data-dnf'), 'dnf'); };
    });
    document.querySelectorAll('[data-retry]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openMoveForm(el.getAttribute('data-retry'), 'reading'); };
    });

    document.getElementById('rj-export').onclick = () => {
      try {
        const payload = JSON.stringify({ exportedAt: new Date().toISOString(), books }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = 'reading-journal-backup-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        backupStatus = 'Backup file saved to your downloads.';
      } catch (e) {
        backupStatus = 'Could not create the backup file.';
      }
      render();
    };

    const importInput = document.getElementById('rj-import-file');
    document.getElementById('rj-import-btn').onclick = () => importInput.click();
    importInput.onchange = () => {
      const file = importInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const incoming = Array.isArray(parsed) ? parsed : parsed.books;
          if (!Array.isArray(incoming)) throw new Error('bad format');
          const existingIds = new Set(books.map(b => b.id));
          let added = 0;
          incoming.forEach(b => {
            if (!b) return;
            if (!b.status) b.status = 'finished';
            if (b.id && !existingIds.has(b.id)) {
              books.push(b);
              existingIds.add(b.id);
              added++;
            } else if (!b.id) {
              b.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
              books.push(b);
              added++;
            }
          });
          backupStatus = added + ' book' + (added === 1 ? '' : 's') + ' imported.';
          persist();
        } catch (e) {
          backupStatus = 'That file did not look like a valid backup.';
          render();
        }
      };
      reader.readAsText(file);
      importInput.value = '';
    };

    if (showForm) {
      if (formStatus === 'finished') {
        const starRow = document.getElementById('rj-star-row');
        let currentRating = editing ? (editing.rating || 0) : 0;
        function paintStars() {
          starRow.querySelectorAll('.rj-star-btn').forEach(btn => {
            const v = parseInt(btn.getAttribute('data-star'), 10);
            btn.classList.toggle('active', v <= currentRating);
          });
        }
        paintStars();
        starRow.querySelectorAll('.rj-star-btn').forEach(btn => {
          btn.onclick = () => {
            const v = parseInt(btn.getAttribute('data-star'), 10);
            currentRating = (currentRating === v) ? 0 : v;
            paintStars();
          };
        });
        root._rjCurrentRating = () => currentRating;
      } else {
        root._rjCurrentRating = () => (editing ? editing.rating || 0 : 0);
      }

      const imgInput = document.getElementById('rj-f-img');
      imgInput.onchange = () => {
        const file = imgInput.files[0];
        if (!file) return;
        if (file.size > 1500000) {
          document.getElementById('rj-img-status').textContent = 'Image too large, pick a smaller one';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          coverData = reader.result;
          document.getElementById('rj-img-status').textContent = 'Image attached';
          document.getElementById('rj-img-pick').textContent = 'Change image';
        };
        reader.onerror = () => {
          document.getElementById('rj-img-status').textContent = 'Could not read that image, try another.';
        };
        reader.readAsDataURL(file);
      };

      const seriesInput = document.getElementById('rj-f-series');
      const seriesNumInput = document.getElementById('rj-f-seriesnum');
      const seriesHint = document.getElementById('rj-series-hint');
      let numTouched = !!(editing && editing.seriesNumber);
      seriesNumInput.oninput = () => { numTouched = true; };
      function updateSeriesHint() {
        const name = seriesInput.value.trim();
        if (!name) { seriesHint.textContent = ''; return; }
        const suggestion = nextSeriesNumber(name, editing ? editing.id : null);
        if (suggestion) {
          seriesHint.textContent = 'Next in this series would be #' + suggestion + '.';
          if (!numTouched) seriesNumInput.value = suggestion;
        } else {
          seriesHint.textContent = '';
        }
      }
      seriesInput.oninput = updateSeriesHint;
      updateSeriesHint();

      const tagsInput = document.getElementById('rj-f-tags');
      const tagChips = document.getElementById('rj-tag-chips');
      if (tagChips) {
        tagChips.querySelectorAll('[data-tag]').forEach(chip => {
          chip.onclick = () => {
            const tag = chip.getAttribute('data-tag');
            const current = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
            if (!current.includes(tag)) current.push(tag);
            tagsInput.value = current.join(', ');
          };
        });
      }

      document.getElementById('rj-cancel').onclick = closeForm;
      document.getElementById('rj-save').onclick = () => {
        const title = document.getElementById('rj-f-title').value.trim();
        const author = document.getElementById('rj-f-author').value.trim();
        const series = seriesInput.value.trim();
        const seriesNumberRaw = seriesNumInput.value.trim();
        const seriesNumber = seriesNumberRaw ? parseFloat(seriesNumberRaw) : '';
        const tags = tagsInput.value.split(',').map(t => t.trim()).filter(Boolean);
        const notesEl = document.getElementById('rj-f-notes');
        const notes = notesEl ? notesEl.value.trim() : '';
        const errEl = document.getElementById('rj-form-error');
        if (!title) {
          errEl.textContent = 'Enter a book title first.';
          return;
        }
        errEl.textContent = '';

        let extra = { status: formStatus };
        if (formStatus === 'tbr') {
          extra.addedDate = (editing && editing.addedDate) ? editing.addedDate : todayStr();
        } else if (formStatus === 'reading') {
          extra.startDate = document.getElementById('rj-f-startdate').value || todayStr();
        } else if (formStatus === 'dnf') {
          extra.dnfDate = document.getElementById('rj-f-dnfdate').value || todayStr();
          extra.reason = document.getElementById('rj-f-reason').value.trim();
        } else {
          extra.date = document.getElementById('rj-f-date').value || todayStr();
          extra.rating = root._rjCurrentRating();
        }

        if (editing) {
          Object.assign(editing, { title, author, series, seriesNumber, tags, notes }, extra);
          if (coverData) editing.cover = coverData;
        } else {
          books.push(Object.assign({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
            title, author, series, seriesNumber, tags, notes,
            cover: coverData || null
          }, extra));
        }
        showForm = false;
        editingId = null;
        coverData = null;
        render();
        persist();
      };
    }
  }

  document.addEventListener('keydown', (e) => {
    if (showForm || currentTab === 'stats') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const inTab = books.filter(b => b.status === currentTab);
    const totalPages = Math.max(1, Math.ceil(inTab.length / PAGE_SIZE));
    const page = pageByTab[currentTab] || 1;
    if (e.key === 'ArrowRight' && page < totalPages) {
      pageByTab[currentTab] = page + 1;
      render();
    } else if (e.key === 'ArrowLeft' && page > 1) {
      pageByTab[currentTab] = page - 1;
      render();
    }
  });

  loadBooks();
})();
</script>
</body></html>
