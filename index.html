<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reading Journal</title>
<meta name="theme-color" content="#1F2E23">
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F7F3EA; color: #2A2A26; font-family: Georgia, serif; }
  body { -webkit-tap-highlight-color: transparent; min-height: 100vh; position: relative; }
  .rj-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  
  .rj-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #1F2E23; color: #F7F3EA; position: sticky; top: 0; z-index: 100; }
  .rj-topbar h1 { font-size: 20px; font-weight: normal; margin: 0; }
  .rj-menu-btn { background: none; border: none; color: #F7F3EA; font-size: 24px; cursor: pointer; padding: 0; }
  
  .rj-drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .rj-drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .rj-drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: #F7F3EA; z-index: 1000; transform: translateX(-100%); transition: transform 0.2s; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 2px 0 12px rgba(0,0,0,0.2); }
  .rj-drawer.open { transform: translateX(0); }
  .rj-drawer-header { font-size: 18px; color: #1F2E23; padding-bottom: 12px; border-bottom: 1px solid #D9D2BC; margin-bottom: 12px; }
  .rj-drawer-item { background: none; border: none; text-align: left; padding: 12px; font-size: 15px; color: #4A4636; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
  .rj-drawer-item.active { background: #E8DFC8; color: #1F2E23; font-weight: bold; }
  .rj-drawer-badge { background: #D9D2BC; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  .rj-container { max-width: 480px; margin: 0 auto; padding: 20px 20px 80px; }
  .rj-count { font-size: 13px; color: #5C6E5A; margin-bottom: 16px; }

  .rj-shelf { display: flex; flex-direction: column; gap: 12px; }
  .rj-card { display: flex; gap: 12px; background: #E8DFC8; border-radius: 4px; padding: 12px; border-left: 3px solid #B8843C; position: relative; }
  .rj-cover { width: 52px; height: 76px; flex-shrink: 0; background: #C9BE9E; border-radius: 2px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #7A7156; font-size: 10px; }
  .rj-cover img { width: 100%; height: 100%; object-fit: cover; }
  .rj-info { flex: 1; min-width: 0; }
  .rj-book-title { font-size: 16px; margin: 0 0 2px; color: #1F2E23; }
  .rj-author { font-size: 13px; color: #5C6E5A; margin: 0 0 6px; font-style: italic; }
  .rj-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #7A7156; font-size: 18px; cursor: pointer; }
  .rj-rating { color: #B8843C; font-size: 12px; }
  .rj-notes { font-size: 12px; color: #3D3D38; margin: 4px 0 0; line-height: 1.4; }
  
  .rj-fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 28px; background: #1F2E23; color: #F7F3EA; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 500; }

  .rj-modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .rj-modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .rj-modal { background: #E8DFC8; border-radius: 6px; padding: 20px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
  .rj-field { margin-bottom: 12px; }
  .rj-field label { display: block; font-size: 12px; color: #5C6E5A; margin-bottom: 4px; }
  .rj-field input, .rj-field textarea, .rj-field select { width: 100%; padding: 8px; border: 1px solid #C9BE9E; border-radius: 3px; background: #FBF9F2; }
  .rj-modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .rj-btn { flex: 1; padding: 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
  .rj-btn-primary { background: #B8843C; color: #FFF; }
  .rj-btn-secondary { background: none; border: 1px solid #C9BE9E; color: #5C6E5A; }

  .rj-online-results { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; }
  .rj-online-cover { width: 60px; height: 90px; object-fit: cover; border: 2px solid transparent; cursor: pointer; border-radius: 3px; }
  .rj-online-cover.selected { border-color: #B8843C; }

  .rj-pager { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; }
  .rj-page-btn { border: 1px solid #C9BE9E; background: none; border-radius: 3px; width: 32px; height: 32px; cursor: pointer; font-size: 13px; color: #5C6E5A; }
  .rj-page-btn.active { background: #1F2E23; color: #F7F3EA; border-color: #1F2E23; }

  .rj-pie-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .rj-pie { width: 100px; height: 100px; border-radius: 50%; flex-shrink: 0; }
  .rj-legend { flex: 1; font-size: 12px; }
  .rj-legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .rj-swatch { width: 12px; height: 12px; border-radius: 2px; }
  
  .rj-month-nav { display: flex; align-items: center; justify-content: space-between; margin: 16px 0; background: #E8DFC8; padding: 8px 12px; border-radius: 4px; }
  .rj-month-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #1F2E23; }
</style>
</head>
<body>

<div class="rj-topbar rj-sans">
  <button class="rj-menu-btn" id="rj-menu-toggle">☰</button>
  <h1 id="rj-header-title">Reading now</h1>
  <div style="width:24px;"></div>
</div>

<div class="rj-drawer-overlay" id="rj-drawer-overlay"></div>
<div class="rj-drawer rj-sans" id="rj-drawer">
  <div class="rj-drawer-header">Reading Journal</div>
  <button class="rj-drawer-item active" data-tab="reading">Reading now <span class="rj-drawer-badge" id="badge-reading">0</span></button>
  <button class="rj-drawer-item" data-tab="finished">Finished <span class="rj-drawer-badge" id="badge-finished">0</span></button>
  <button class="rj-drawer-item" data-tab="dnf">Didn't finish <span class="rj-drawer-badge" id="badge-dnf">0</span></button>
  <button class="rj-drawer-item" data-tab="tbr">TBR <span class="rj-drawer-badge" id="badge-tbr">0</span></button>
  <button class="rj-drawer-item" data-tab="stats">Stats & Analytics</button>
</div>

<div class="rj-container">
  <div id="rj-content"></div>
  <div id="rj-pager-container"></div>
</div>

<button class="rj-fab" id="rj-fab">+</button>

<div class="rj-modal-backdrop" id="rj-modal-backdrop">
  <div class="rj-modal rj-sans">
    <h3 id="rj-modal-title" style="margin-top:0;">Add Book</h3>
    <div class="rj-field">
      <label>Status</label>
      <select id="f-status">
        <option value="reading">Reading now</option>
        <option value="finished">Finished</option>
        <option value="dnf">Didn't finish</option>
        <option value="tbr">TBR</option>
      </select>
    </div>
    <div class="rj-field"><label>Title</label><input type="text" id="f-title" placeholder="Book Title" /></div>
    <div class="rj-field"><label>Author</label><input type="text" id="f-author" placeholder="Author" /></div>
    
    <div class="rj-field">
      <label>Cover Image</label>
      <div style="display:flex; gap:8px; margin-bottom:8px;">
        <button type="button" class="rj-btn rj-btn-secondary" id="rj-btn-search-online" style="font-size:12px; padding:6px;">🔍 Find Online</button>
        <input type="file" id="f-img" accept="image/*" style="flex:1;" />
      </div>
      <div id="rj-online-results" class="rj-online-results"></div>
    </div>

    <div class="rj-field"><label>Rating (1-5)</label><input type="number" id="f-rating" min="1" max="5" placeholder="5" /></div>
    <div class="rj-field"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>

    <div class="rj-modal-actions">
      <button class="rj-btn rj-btn-secondary" id="rj-modal-cancel">Cancel</button>
      <button class="rj-btn rj-btn-primary" id="rj-modal-save">Save</button>
    </div>
  </div>
</div>

<script>
(function() {
  const PAGE_SIZE = 6;
  let db;
  let books = [];
  let currentTab = 'reading';
  let currentPage = 1;
  let editingId = null;
  let tempCover = null;
  let selectedMonth = new Date().getMonth();
  let selectedYear = new Date().getFullYear();

  // Initialize IndexedDB Database
  const request = indexedDB.open('ReadingJournalDB', 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains('books')) {
      db.createObjectStore('books', { keyPath: 'id' });
    }
  };
  request.onsuccess = (e) => {
    db = e.target.result;
    loadBooks();
  };

  function loadBooks() {
    const tx = db.transaction('books', 'readonly');
    const store = tx.objectStore('books');
    const req = store.getAll();
    req.onsuccess = () => {
      books = req.result || [];
      render();
    };
  }

  function saveBookToDB(book) {
    const tx = db.transaction('books', 'readwrite');
    const store = tx.objectStore('books');
    store.put(book);
    tx.oncomplete = () => loadBooks();
  }

  function deleteBookFromDB(id) {
    const tx = db.transaction('books', 'readwrite');
    const store = tx.objectStore('books');
    store.delete(id);
    tx.oncomplete = () => loadBooks();
  }

  // Canvas Image Compression
  function processImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max = 300;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } }
        else { if (h > max) { w *= max / h; h = max; } }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Drawer Toggle
  const drawer = document.getElementById('rj-drawer');
  const overlay = document.getElementById('rj-drawer-overlay');
  document.getElementById('rj-menu-toggle').onclick = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
  overlay.onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('open'); };

  document.querySelectorAll('.rj-drawer-item').forEach(btn => {
    btn.onclick = () => {
      currentTab = btn.getAttribute('data-tab');
      currentPage = 1;
      drawer.classList.remove('open'); overlay.classList.remove('open');
      render();
    };
  });

  // Modal Controls
  const modal = document.getElementById('rj-modal-backdrop');
  document.getElementById('rj-fab').onclick = () => {
    editingId = null; tempCover = null;
    document.getElementById('f-title').value = '';
    document.getElementById('f-author').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('f-rating').value = '';
    document.getElementById('rj-online-results').innerHTML = '';
    document.getElementById('f-status').value = currentTab === 'stats' ? 'reading' : currentTab;
    modal.classList.add('open');
  };
  document.getElementById('rj-modal-cancel').onclick = () => modal.classList.remove('open');

  document.getElementById('f-img').onchange = function(e) {
    if (e.target.files[0]) processImage(e.target.files[0], url => { tempCover = url; });
  };

  // Online Cover Search via Open Library
  document.getElementById('rj-btn-search-online').onclick = async () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) return alert('Please enter a book title first to search.');
    const resultsContainer = document.getElementById('rj-online-results');
    resultsContainer.innerHTML = '<span style="font-size:12px; color:#5C6E5A;">Searching online...</span>';

    try {
      const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&limit=5`);
      const data = await res.json();
      resultsContainer.innerHTML = '';
      
      const covers = data.docs.filter(d => d.cover_i).slice(0, 5);
      if (covers.length === 0) {
        resultsContainer.innerHTML = '<span style="font-size:12px; color:#A34A2E;">No covers found online.</span>';
        return;
      }

      covers.forEach(c => {
        const imgUrl = `https://covers.openlibrary.org/b/id/${c.cover_i}-M.jpg`;
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'rj-online-cover';
        img.onclick = () => {
          document.querySelectorAll('.rj-online-cover').forEach(i => i.classList.remove('selected'));
          img.classList.add('selected');
          // Fetch image & convert to local base64 stored in IndexedDB
          fetch(imgUrl).then(r => r.blob()).then(blob => {
            processImage(blob, base64 => { tempCover = base64; });
          });
        };
        resultsContainer.appendChild(img);
      });
    } catch (e) {
      resultsContainer.innerHTML = '<span style="font-size:12px; color:#A34A2E;">Search failed. Check internet connection.</span>';
    }
  };

  document.getElementById('rj-modal-save').onclick = () => {
    const title = document.getElementById('f-title').value.trim();
    if (!title) return alert('Title required');
    const status = document.getElementById('f-status').value;
    const author = document.getElementById('f-author').value.trim();
    const notes = document.getElementById('f-notes').value.trim();
    const rating = parseInt(document.getElementById('f-rating').value) || 0;

    let book;
    if (editingId) {
      book = books.find(x => x.id === editingId);
      Object.assign(book, { title, author, notes, rating, status });
      if (tempCover) book.cover = tempCover;
    } else {
      book = { id: Date.now().toString(36), title, author, notes, rating, status, cover: tempCover, date: new Date().toISOString().slice(0,10) };
    }
    modal.classList.remove('open');
    saveBookToDB(book);
  };

  function deleteBook(id) {
    if (confirm('Are you sure you want to delete this book?')) {
      deleteBookFromDB(id);
    }
  }

  function renderStats() {
    const counts = { reading: 0, finished: 0, dnf: 0, tbr: 0 };
    books.forEach(b => counts[b.status] = (counts[b.status] || 0) + 1);
    const total = books.length || 1;

    const pReading = (counts.reading / total) * 100;
    const pFinished = (counts.finished / total) * 100;
    const pDnf = (counts.dnf / total) * 100;

    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthBooks = books.filter(b => b.status === 'finished' && b.date && new Date(b.date).getMonth() === selectedMonth && new Date(b.date).getFullYear() === selectedYear);

    return `
      <h3 class="rj-sans" style="margin-top:0;">Shelf Breakdown</h3>
      <div class="rj-pie-wrap rj-sans">
        <div class="rj-pie" style="background: conic-gradient(#1F2E23 0% ${pReading}%, #B8843C ${pReading}% ${pReading+pFinished}%, #A34A2E ${pReading+pFinished}% ${pReading+pFinished+pDnf}%, #C9BE9E ${pReading+pFinished+pDnf}% 100%);"></div>
        <div class="rj-legend">
          <div class="rj-legend-row"><span class="rj-swatch" style="background:#1F2E23;"></span> Reading (${counts.reading})</div>
          <div class="rj-legend-row"><span class="rj-swatch" style="background:#B8843C;"></span> Finished (${counts.finished})</div>
          <div class="rj-legend-row"><span class="rj-swatch" style="background:#A34A2E;"></span> DNF (${counts.dnf})</div>
          <div class="rj-legend-row"><span class="rj-swatch" style="background:#C9BE9E;"></span> TBR (${counts.tbr})</div>
        </div>
      </div>
      <h3 class="rj-sans">Monthly Timeline</h3>
      <div class="rj-month-nav rj-sans">
        <button class="rj-month-btn" id="m-prev">‹</button>
        <span>${monthNames[selectedMonth]} ${selectedYear}</span>
        <button class="rj-month-btn" id="m-next">›</button>
      </div>
      <div class="rj-shelf">
        ${monthBooks.length === 0 ? '<p class="rj-sans" style="color:#7A7156; text-align:center;">No books finished in this month.</p>' : monthBooks.map(b => `
          <div class="rj-card">
            <div class="rj-cover">${b.cover ? `<img src="${b.cover}" />` : 'no cover'}</div>
            <div class="rj-info">
              <p class="rj-book-title">${b.title}</p>
              <p class="rj-author">${b.author || 'Unknown'}</p>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function render() {
    ['reading','finished','dnf','tbr'].forEach(tab => {
      const el = document.getElementById('badge-' + tab);
      if (el) el.textContent = books.filter(b => b.status === tab).length;
    });

    document.querySelectorAll('.rj-drawer-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-tab') === currentTab);
    });

    document.getElementById('rj-header-title').textContent = {
      reading: 'Reading now', finished: 'Finished', dnf: "Didn't finish", tbr: 'TBR', stats: 'Stats & Analytics'
    }[currentTab];

    const content = document.getElementById('rj-content');
    const pager = document.getElementById('rj-pager-container');

    if (currentTab === 'stats') {
      content.innerHTML = renderStats();
      pager.innerHTML = '';
      document.getElementById('m-prev').onclick = () => {
        if (selectedMonth === 0) { selectedMonth = 11; selectedYear--; } else { selectedMonth--; }
        render();
      };
      document.getElementById('m-next').onclick = () => {
        if (selectedMonth === 11) { selectedMonth = 0; selectedYear++; } else { selectedMonth++; }
        render();
      };
      return;
    }

    const filtered = books.filter(b => b.status === currentTab);
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    const items = filtered.slice(start, start + PAGE_SIZE);

    if (filtered.length === 0) {
      content.innerHTML = `<p class="rj-sans" style="text-align:center; color:#7A7156; margin-top:40px;">No books in this shelf.</p>`;
      pager.innerHTML = '';
      return;
    }

    content.innerHTML = `<p class="rj-count rj-sans">${filtered.length} book${filtered.length === 1 ? '' : 's'}</p>` +
      '<div class="rj-shelf">' + items.map(b => `
        <div class="rj-card">
          <button class="rj-del" data-del="${b.id}">×</button>
          <div class="rj-cover">${b.cover ? `<img src="${b.cover}" />` : 'no cover'}</div>
          <div class="rj-info">
            <p class="rj-book-title">${b.title}</p>
            <p class="rj-author">${b.author || 'Unknown author'}</p>
            ${b.rating ? `<p class="rj-rating">${'★'.repeat(b.rating)}</p>` : ''}
            ${b.notes ? `<p class="rj-notes">${b.notes}</p>` : ''}
          </div>
        </div>
      `).join('') + '</div>';

    if (totalPages > 1) {
      let pBtns = '';
      for (let i = 1; i <= totalPages; i++) {
        pBtns += `<button class="rj-page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      pager.innerHTML = `<div class="rj-pager rj-sans">${pBtns}</div>`;
      pager.querySelectorAll('[data-page]').forEach(b => {
        b.onclick = () => { currentPage = parseInt(b.getAttribute('data-page')); render(); };
      });
    } else {
      pager.innerHTML = '';
    }

    document.querySelectorAll('[data-del]').forEach(b => {
      b.onclick = () => deleteBook(b.getAttribute('data-del'));
    });
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./pwabuilder-sw.js');
})();
</script>
</body>
</html>
